server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      # Global timeouts for all routed calls
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

      routes:
        # ============================================================
        # PUBLIC ROUTES — no JwtAuth filter.
        # Listed FIRST: Spring Cloud Gateway is first-match, so the
        # specific public paths must appear ABOVE the protected /users
        # and /auth catch-alls that would otherwise shadow them.
        # ============================================================
        - id: auth-register
          uri: ${UPSTREAM_USER:http://localhost:8081}
          predicates:
            - Path=/auth/register

        - id: auth-login
          uri: ${UPSTREAM_USER:http://localhost:8081}
          predicates:
            - Path=/auth/login

        # ============================================================
        # PROTECTED ROUTES — JwtAuth verifies the token and injects
        # X-User-Id / X-User-Email / X-User-Roles downstream.
        # ============================================================
        - id: users-protected
          uri: ${UPSTREAM_USER:http://localhost:8081}
          predicates:
            - Path=/users/**
          filters:
            - name: JwtAuth

        - id: products-protected
          uri: ${UPSTREAM_PRODUCT:http://localhost:8082}
          predicates:
            - Path=/products/**
          filters:
            - name: JwtAuth

# Shared with user-service (the signer). Injected via JWT_SECRET.
gateway:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-bytes-min}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
